{# HTMX appends the comment at the end of the list and swaps in a clean form (oob); on error (422) it
   swaps in a version with the message and the typed text. #}
<form id="comment-form" class="card form" method="post" action="{{ cbase }}/comments"
      hx-post="{{ cbase }}/comments" hx-target="#comments" hx-swap="beforeend"{% if oob %} hx-swap-oob="true"{% endif %}>
  {{ csrf_input() }}
  <label>Nowy komentarz
    <textarea name="body" rows="3" required>{{ comment_draft or '' }}</textarea>
  </label>
  {% if comment_error %}<p class="error-text" role="alert">{{ comment_error }}</p>{% endif %}
  <div class="row">
    <button class="btn primary">Dodaj komentarz</button>
    <span class="muted small-note">najwyżej {{ TEXT_MAX_CHARS }} znaków</span>
  </div>
</form>

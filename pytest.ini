[pytest]
testpaths = tests
# Domyślnie pomijamy testy interfejsu w przeglądarce (wolne); uruchamia je `pytest -m e2e` albo scripts/e2e.sh.
addopts = -m "not e2e"
markers =
    ffmpeg: wymaga zainstalowanego ffmpeg/ffprobe (pomijany, gdy brak)
    e2e: test interfejsu w przeglądarce (Playwright + Chromium, prawdziwy serwer i worker)
filterwarnings =
    ignore::DeprecationWarning

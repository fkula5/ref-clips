[pytest]
testpaths = tests
# Browser UI tests are skipped by default (slow); run them with `pytest -m e2e` or scripts/e2e.sh.
addopts = -m "not e2e"
markers =
    ffmpeg: wymaga zainstalowanego ffmpeg/ffprobe (pomijany, gdy brak)
    e2e: test interfejsu w przeglądarce (Playwright + Chromium, prawdziwy serwer i worker)
filterwarnings =
    ignore::DeprecationWarning

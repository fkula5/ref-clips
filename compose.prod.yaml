# Production overlay on compose.yaml: always use both files:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# (or set COMPOSE_FILE=compose.yaml:compose.prod.yaml once). The services init, app and worker stay
# defined in compose.yaml; only the differences are here: no app port on the host, `app` on the shared
# `edge` network, log rotation.
# HTTPS and the public ports belong to the separate edge proxy (github.com/fkula5/vps-edge, /opt/edge),
# not to this project: deploy/install-site.sh gives it deploy/ref-clips.caddy. The `edge` network must
# exist before `up` (docs/wdrozenie.md).
# Settings come from .env (template: deploy/env.prod.example). Guide: docs/wdrozenie.md
# The e-mail digest needs no entry here: compose.yaml gives app and worker the whole .env (env_file), and
# the REFCLIPS_SMTP_* / REFCLIPS_MAIL_FROM* variables, including the SMTP password, are read from there.
# Nothing secret is written in the compose files. Guide: docs/email-digest.md
name: ref-clips

x-logi: &logi
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  init:
    logging: *logi

  app:
    # The app is not published on the host: the only way in from outside is the edge proxy.
    ports: !reset []
    networks:
      default:  # worker and init stay here only; the database and the worker are not on `edge`
      edge:
        aliases:
          - ref-clips-app  # what deploy/ref-clips.caddy proxies to; unique across all sites on the edge
    logging: *logi

  worker:
    logging: *logi

networks:
  edge:
    name: edge
    external: true

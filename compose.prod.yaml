# ref-clips na serwerze (produkcja): NAKŁADKA na compose.yaml — używaj zawsze obu plików:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# (albo ustaw raz COMPOSE_FILE=compose.yaml:compose.prod.yaml). Usługi init, app i worker zostają
# zdefiniowane w compose.yaml, tu tylko to, co się różni: brak portu aplikacji na hoście, Caddy
# z HTTPS, rotacja logów. Ustawienia czyta z pliku .env (wzór: deploy/env.prod.example).
# Instrukcja: docs/wdrozenie.md
name: ref-clips

x-logi: &logi
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  init:
    logging: *logi

  app:
    # Aplikacja nie jest publikowana na hoście — jedyne wejście z zewnątrz to Caddy (sieć compose).
    ports: !reset []
    logging: *logi

  worker:
    logging: *logi

  caddy:
    # Wersja przypięta; podnoś świadomie (sprawdź https://hub.docker.com/_/caddy/tags) i wdrażaj ponownie.
    image: caddy:2.9.1
    restart: unless-stopped
    environment:
      # Adres strony (nazwa hosta, np. 57-131-162-204.sslip.io); Caddy sam wystawia certyfikat.
      REFCLIPS_SITE: ${REFCLIPS_SITE:?Ustaw REFCLIPS_SITE w pliku .env (np. 57-131-162-204.sslip.io)}
    ports:
      - "${REFCLIPS_HTTP_PORT:-80}:80"
      - "${REFCLIPS_HTTPS_PORT:-443}:443"
      - "${REFCLIPS_HTTPS_PORT:-443}:443/udp"     # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certyfikaty i klucze konta Let's Encrypt — NIE kasować
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logi

volumes:
  caddy_data:
  caddy_config:

# Production overlay on compose.yaml: always use both files:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# (or set COMPOSE_FILE=compose.yaml:compose.prod.yaml once). The services init, app and worker stay
# defined in compose.yaml; only the differences are here: no app port on the host, Caddy with HTTPS, log
# rotation.
# Settings come from .env (template: deploy/env.prod.example). Guide: docs/wdrozenie.md
# The e-mail digest needs no entry here: compose.yaml gives app and worker the whole .env (env_file), and
# the REFCLIPS_SMTP_* / REFCLIPS_MAIL_FROM* variables, including the SMTP password, are read from there.
# Nothing secret is written in the compose files. Guide: docs/email-digest.md
name: ref-clips

x-logi: &logi
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  init:
    logging: *logi

  app:
    # The app is not published on the host: the only way in from outside is Caddy (compose network).
    ports: !reset []
    logging: *logi

  worker:
    logging: *logi

  caddy:
    # Pinned version; upgrade deliberately (check https://hub.docker.com/_/caddy/tags) and redeploy.
    image: caddy:2.9.1
    restart: unless-stopped
    environment:
      REFCLIPS_SITE: ${REFCLIPS_SITE:?Ustaw REFCLIPS_SITE w pliku .env (np. refclips.pl)}
      # Optional, space-separated: hosts that redirect to REFCLIPS_SITE (www, the old sslip.io name).
      REFCLIPS_REDIRECT_HOSTS: ${REFCLIPS_REDIRECT_HOSTS:-}
    ports:
      - "${REFCLIPS_HTTP_PORT:-80}:80"
      - "${REFCLIPS_HTTPS_PORT:-443}:443"
      - "${REFCLIPS_HTTPS_PORT:-443}:443/udp"     # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # certificates and Let's Encrypt account keys: do NOT delete
      - caddy_config:/config
      # Extra sites (see the end of deploy/Caddyfile); docker creates the directory if it is missing.
      - ${REFCLIPS_CADDY_SITES_DIR:-/opt/caddy-sites}:/etc/caddy/sites:ro
    networks:
      - default
      # Only Caddy joins this network, so other sites' containers can be proxied without reaching app/worker.
      - sites
    depends_on:
      app:
        condition: service_healthy
    logging: *logi

volumes:
  caddy_data:
  caddy_config:

networks:
  # Fixed name, so other compose projects can join it as `external: true`.
  sites:
    name: caddy-sites

# Tests: run on every PR to main and manually (workflow_dispatch).
# Job names (`unit`, `e2e`) are stable because they are set as required checks of the main protection
# (docs/ci-cd.md). No `paths:` or other filters that would skip the workflow: a skipped required check
# would hang as "pending" and block the merge.
#
# release.yml also uses workflow_dispatch for the release PR: a PR created by GITHUB_TOKEN does not
# trigger `pull_request`, so the tests are started manually on its branch and the result is also
# reported as a commit status (last step of each job). Details and limits: docs/ci-cd.md.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Zainstaluj ffmpeg
        timeout-minutes: 8
        run: .github/scripts/install-ffmpeg.sh
      - name: Zainstaluj zależności
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Testy jednostkowe i API
        run: .venv/bin/python -m pytest -q
      - name: Zgłoś wynik jako status commita (tylko PR wydania)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release-please--') }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" -f context="unit" \
            -f description="Testy na gałęzi PR-a wydania (uruchomione ręcznie)" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Zainstaluj ffmpeg
        timeout-minutes: 8
        run: .github/scripts/install-ffmpeg.sh
      - name: Zainstaluj zależności
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Zainstaluj Chromium (Playwright)
        run: .venv/bin/playwright install --with-deps chromium
      - name: Testy interfejsu w przeglądarce
        run: scripts/e2e.sh -q -rf
      - name: Zrzuty ekranu i logi (przy porażce)
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artefakty
          path: /tmp/refclips-e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Zgłoś wynik jako status commita (tylko PR wydania)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release-please--') }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" -f context="e2e" \
            -f description="Testy interfejsu na gałęzi PR-a wydania (uruchomione ręcznie)" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

# Wydania i wdrożenie ref-clips (opis całości: docs/ci-cd.md).
#
#   push do main ──► release-please: PR „wydanie vX.Y.Z” (lista zmian z Conventional Commits)
#                    └ po merge'u tego PR-a: tag + GitHub Release ──► build obrazu (GHCR) ──► wdrożenie (ssh)
#   Run workflow  ──► (tag) pomija release-please, buduje obraz tylko jeśli go brak i wdraża podany tag
#                     (ponowienie po błędzie albo powrót do starszej wersji).
#
# Tag utworzony przez GITHUB_TOKEN nie uruchamia innych workflow, dlatego build i wdrożenie są kolejnymi
# jobami TEGO workflow, a nie osobnymi plikami reagującymi na tag.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy, e.g. v1.2.3 (retry after a failure or roll back to an older version)"
        required: true
        type: string

# Domyślnie tylko odczyt; mocniejsze uprawnienia dopiero w jobach, które ich potrzebują.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/fkula5/ref-clips

jobs:
  # 1. release-please (push) albo sprawdzenie podanego tagu (ręczne uruchomienie). Wynik: tag do zbudowania i wdrożenia.
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write        # tag i GitHub Release, gałąź PR-a wydania
      pull-requests: write   # PR wydania i jego etykiety
      issues: write          # etykiety („autorelease: pending/tagged”) są przez API zgłoszeń
      actions: write         # uruchomienie ci.yml na gałęzi PR-a wydania (workflow_dispatch)
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.rp.outputs.release_created == 'true' && steps.rp.outputs.tag_name || steps.reczny.outputs.tag }}
    steps:
      - name: Validate tag (manual run)
        id: reczny
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch (selected: $GITHUB_REF)."
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must look like vX.Y.Z (e.g. v1.2.3), got: ${TAG:0:40}"
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --silent 2>/dev/null; then
            echo "::error::Tag $TAG does not exist in this repository."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: release-please
        id: rp
        if: ${{ github.event_name == 'push' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # PR utworzony lub zaktualizowany przez GITHUB_TOKEN nie uruchamia zdarzenia pull_request, więc testy
      # odpalamy sami (workflow_dispatch tworzy przebieg także dla GITHUB_TOKEN). Wynik trafia na ten sam commit.
      - name: Run tests on the release PR branch
        if: ${{ github.event_name == 'push' && steps.rp.outputs.prs_created == 'true' && steps.rp.outputs.release_created != 'true' }}
        continue-on-error: true   # a failure here must never block building and deploying a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # this job has no checkout, so gh does not know the repository
          PR_JSON: ${{ steps.rp.outputs.pr }}   # may be empty; parsed in the shell, because fromJSON('') fails the whole step
        run: |
          set -euo pipefail
          BRANCH="$(jq -r '.headBranchName // empty' <<<"${PR_JSON:-null}")"
          case "$BRANCH" in
            release-please--*) echo "Running tests on: $BRANCH"; gh workflow run ci.yml --ref "$BRANCH" ;;
            "") echo "release-please reported no pull request; nothing to test." ;;
            *) echo "::error::Unexpected release PR branch: ${BRANCH:0:60}"; exit 1 ;;
          esac

      - name: Summary
        env:
          TAG: ${{ steps.rp.outputs.release_created == 'true' && steps.rp.outputs.tag_name || steps.reczny.outputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            echo "To build and deploy: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No new release in this run (the release PR was created or updated, or there is nothing to release)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # 2. Obraz Dockera w GHCR: ghcr.io/fkula5/ref-clips:vX.Y.Z oraz :sha-xxxxxxx. Istniejącego obrazu nie nadpisujemy.
  build:
    name: Docker image
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write        # tylko ten job publikuje w GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this image already exists
        id: exists
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=7 HEAD)"
          echo "sha_tag=sha-${short}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "Image ${IMAGE}:${TAG} already exists, skipping the build." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push the image
        if: ${{ steps.exists.outputs.found != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false   # jeden zwykły manifest (bez dodatkowych wpisów atestacji w pakiecie)
          tags: |
            ${{ env.IMAGE }}:${{ needs.release.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.exists.outputs.sha_tag }}
          build-args: |
            REFCLIPS_VERSION=${{ needs.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.exists.outputs.revision }}
            org.opencontainers.image.title=ref-clips
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Wdrożenie: jedno polecenie ssh, które na serwerze trafia do wymuszonego skryptu deploy/ci-entry.sh.
  deploy:
    name: Deploy
    needs: [release, build]
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150     # do 2 h czekania, aż nic nie trwa na serwerze, plus pobranie i start
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/known_hosts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Prepare the SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          for name in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the production environment (docs/ci-cd.md, step 3)."
              exit 1
            fi
          done
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/ci_deploy"
          if ! ssh-keygen -y -f "$HOME/.ssh/ci_deploy" >/dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY is not a valid private key (the whole file, including the BEGIN/END lines)."
            exit 1
          fi
          # Host key serwera przypięty w repozytorium; StrictHostKeyChecking=yes, bez zgadywania przy pierwszym połączeniu.
          cp deploy/known_hosts "$HOME/.ssh/ref_clips_known_hosts"

      - name: Deploy to the server
        env:
          TAG: ${{ needs.release.outputs.tag }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -uo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag: ${TAG:0:40}"
            exit 1
          fi
          echo "Deploying $TAG to the server (waiting up to 2 hours if something is running)..."
          rc=0
          ssh -F /dev/null \
            -i "$HOME/.ssh/ci_deploy" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/ref_clips_known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" deploy "$TAG" || rc=$?
          {
            echo "### Deploy $TAG"
            case "$rc" in
              0)   echo "Deployed." ;;
              3)   echo "**Not deployed:** an upload or conversion was running for 2 hours. Nothing was changed. Retry: Actions → Release → Run workflow, tag \`$TAG\`." ;;
              4)   echo "**The new version did not start; the server rolled back to the previous one.** See the step log. Fix it and release a new version." ;;
              5)   echo "**The new version did not start and the rollback failed too.** Manual intervention on the server is required (see docs/ci-cd.md)." ;;
              255) echo "**SSH connection error** (key, host, firewall, or a server host key that differs from \`deploy/known_hosts\`)." ;;
              *)   echo "**Deploy failed** (exit code $rc). See the step log. Retry: Actions → Release → Run workflow, tag \`$TAG\`." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Remove the key from the runner
        if: ${{ always() }}
        run: rm -f "$HOME/.ssh/ci_deploy" "$HOME/.ssh/ref_clips_known_hosts"
